[workspace]
members = ["rust/core", "rust/utils", "ui/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.1.0"
authors = ["luoluoqixi"]
repository = "https://github.com/luoluoqixi/lonanote"
license = "MIT"

[workspace.dependencies]
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.52", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
log = "0.4"
thiserror = "2.0"
notify = "8.2"
ignore = "0.4"
fs_extra = "1.3"
walkdir = "2.5"
dunce = "1.0"
fork = "0.7"
rfd = "0.17"
fern = "0.7"
chrono = "0.4"
alphanumeric-sort = "1.5"
trash = "5.2"
encoding_rs = "0.8"
futures = "0.3"
rust-embed = "8.11"
sha2 = "0.10"
uuid = { version = "1.18", features = ["v4", "serde"] }
dark-light = "2.0"
sys-locale = "0.3"
same-file = "1.0"
tempfile = "3.27"

# cmdreg = "0.2"
cmdreg = { git = "https://github.com/luoluoqixi/cmdreg", branch = "main" }

# tauri
tauri-build = { version = "2.7.4" }
tauri = { version = "2.12.5" }
tauri-plugin-clipboard-manager = { version = "2.5.0" }
tauri-plugin-fs = { version = "2.7.1" }
tauri-plugin-log = { version = "2.10.1" }
tauri-plugin-os = { version = "2.4.0" }
tauri-plugin-dialog = { version = "2.8.4" }
tauri-plugin-shell = { version = "2.6.0" }
tauri-plugin-global-shortcut = { version = "2.4.1" }
tauri-plugin-single-instance = { version = "2.5.5" }
# tauri-plugin-updater = { version = "2.14.1" }

# macos
objc2 = { version = "0.6.5" }
objc2-app-kit = { version = "0.3.2" }

# windows
webview2-com = { version = "0.39.1" }
windows = { version = "0.62.2" }


[profile.release]
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true        # Enables link to optimizations
opt-level = "s"   # Optimize for binary size
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Remove debug symbols
